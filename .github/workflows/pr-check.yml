name: PR Check - Dependency Installation

on:
  pull_request:
    branches: [ main ]

jobs:
  test-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -e .

      - name: Verify installation
        run: |
          . .venv/bin/activate
          python -c "import adventure_game; print('✅ Dependencies installed successfully!')" 
